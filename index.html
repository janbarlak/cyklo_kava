<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyklo Káva</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { font-size: 24px; margin-bottom: 5px; color: #4a3728; }
    p { color: #666; font-size: 14px; margin-bottom: 25px; }
    .btn { background: #8B5A2B; color: white; padding: 15px 30px; border: none; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; box-shadow: 0 4px 6px rgba(139,90,43,0.2); transition: 0.2s; }
    .btn:active { transform: scale(0.98); }
    .kaviaren-box { background: #fdfaf7; margin-top: 20px; padding: 15px; border-radius: 12px; border-left: 5px solid #8B5A2B; text-align: left; }
    .kaviaren-box h3 { margin: 0 0 5px 0; font-size: 18px; }
    .link-btn { display: inline-block; margin-top: 8px; color: #8B5A2B; font-weight: bold; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>☕ Cyklo Káva</h1>
    <p>Nájdi top kaviarne v Google Maps do 1 km</p>
    
    <button class="btn" onclick="najdiKavu()">Vyhľadať v okolí</button>
    
    <div id="vysledky"></div>
  </div>

  <script>
    // Registrácia PWA Service Workera
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    function najdiKavu() {
      const vysledkyDiv = document.getElementById("vysledky");
      vysledkyDiv.innerHTML = "<p>Zisťujem vašu polohu...</p>";

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            
            // Vygenerujeme odkaz na vyhľadávanie kaviarní v Google Maps okolo vašich súradníc
            const googleMapsUrl = `https://google.com${lat},${lon},15z/data=!3m1!4b1`;

            vysledkyDiv.innerHTML = `
              <div class="kaviaren-box">
                <h3>Kaviarne nájdené!</h3>
                <p>Kliknutím otvoríte Google Maps so zoradenými top kaviarňami priamo vo vašom okruhu 1 km.</p>
                <a href="${googleMapsUrl}" target="_blank" class="link-btn">➡️ Otvoriť v Google Maps</a>
              </div>
            `;
          },
          (error) => {
            vysledkyDiv.innerHTML = "<p style='color:red;'>Chyba: Musíte aplikácii povoliť prístup k GPS.</p>";
          }
        );
      } else {
        vysledkyDiv.innerHTML = "<p>GPS nie je podporované vaším prehliadačom.</p>";
      }
    }
  </script>
</body>
</html>
