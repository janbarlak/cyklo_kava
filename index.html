<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyklo Káva</title>

<link rel="manifest" href="manifest.json">

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    background: #f4f4f9;
    margin: 0;
    padding: 20px;
    color: #333;
}

.container {
    max-width: 500px;
    margin: 0 auto;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

h1 {
    color: #4a3728;
}

.btn {
    background: #8B5A2B;
    color: white;
    padding: 15px;
    border: none;
    border-radius: 30px;
    width: 100%;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.kaviaren-box {
    background: #fdfaf7;
    margin-top: 15px;
    padding: 15px;
    border-radius: 12px;
    border-left: 5px solid #8B5A2B;
    text-align: left;
}

.link-btn {
    display: inline-block;
    padding: 10px 14px;
    margin-right: 8px;
    margin-top: 8px;
    background: #8B5A2B;
    color: white;
    text-decoration: none;
    border-radius: 20px;
    font-size: 14px;
}

.status {
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>☕ Cyklo Káva</h1>

<p>Nájdi 3 najbližšie kaviarne</p>

<button class="btn" onclick="najdiKavu()">
Vyhľadať v okolí
</button>

<div id="vysledky" class="status"></div>

</div>

<script>

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

function vzdialenost(lat1, lon1, lat2, lon2) {

    const R = 6371000;

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    const c = 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
    );

    return Math.round(R * c);
}

async function najdiKavu() {

    const vysledky = document.getElementById("vysledky");

    vysledky.innerHTML =
        "<div class='kaviaren-box'>📍 Zisťujem polohu...</div>";

    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            vysledky.innerHTML =
                "<div class='kaviaren-box'>🔍 Hľadám kaviarne...</div>";

            try {

                const query = `
[out:json];
node["amenity"="cafe"](around:1000,${lat},${lon});
out;
`;

                const response = await fetch(
                    "https://overpass-api.de/api/interpreter",
                    {
                        method: "POST",
                        body: query
                    }
                );

                const data = await response.json();

                if (!data.elements || data.elements.length === 0) {

                    vysledky.innerHTML = `
                        <div class="kaviaren-box">
                            ☹️ V okruhu 1 km nebola nájdená žiadna kaviareň.
                        </div>
                    `;

                    return;
                }

                const cafes = data.elements.map(cafe => {

                    return {
                        name: cafe.tags?.name || "Neznáma kaviareň",
                        lat: cafe.lat,
                        lon: cafe.lon,
                        distance: vzdialenost(
                            lat,
                            lon,
                            cafe.lat,
                            cafe.lon
                        )
                    };

                });

                cafes.sort((a, b) => a.distance - b.distance);

                const top3 = cafes.slice(0, 3);

                vysledky.innerHTML = "";

                top3.forEach(cafe => {

                    const googleMapsUrl =
                        `https://www.google.com/maps/dir/?api=1&destination=${cafe.lat},${cafe.lon}`;

                    const appleMapsUrl =
                        `http://maps.apple.com/?daddr=${cafe.lat},${cafe.lon}`;

                    vysledky.innerHTML += `
                        <div class="kaviaren-box">
                            <h3>☕ ${cafe.name}</h3>

                            <p>📍 ${cafe.distance} m</p>

                            <a
                                           </a>

                            <a
ppleMapsUrl}
                                🍎 Apple Maps
                            </a>
                        </div>
                    `;

                });

            }
            catch(error) {

                vysledky.innerHTML = `
                    <div class="kaviaren-box">
                        ❌ Chyba pri načítaní kaviarní
                        <br><br>
                        ${error}
                    </div>
                `;

            }

        },

        function(error) {

            vysledky.innerHTML = `
                <div class="kaviaren-box">
                    ❌ GPS chyba
                    <br><br>
                    ${error.message}
                </div>
            `;

        }

    );

}

</script>

</body>
</html>
