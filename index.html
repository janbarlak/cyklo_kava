<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyklo Káva</title>

<link rel="manifest" href="manifest.json">

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f4f9;
    margin: 0;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: 0 auto;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

.btn {
    background: #8B5A2B;
    color: white;
    border: none;
    border-radius: 30px;
    padding: 15px;
    width: 100%;
    font-size: 16px;
    font-weight: bold;
}

.kaviaren-box {
    background: #fdfaf7;
    margin-top: 15px;
    padding: 15px;
    border-radius: 12px;
    border-left: 5px solid #8B5A2B;
    text-align: left;
}

.link-btn {
    display: inline-block;
    margin-top: 10px;
    background: #8B5A2B;
    color: white;
    text-decoration: none;
    padding: 10px 15px;
    border-radius: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>☕ Cyklo Káva</h1>

<p>Nájdi 3 najbližšie kaviarne</p>

<button class="btn" onclick="najdiKavu()">
Vyhľadať v okolí
</button>

<div id="vysledky"></div>

</div>

<script>

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

async function najdiKavu() {

    const vysledky = document.getElementById("vysledky");

    vysledky.innerHTML =
        "<div class='kaviaren-box'>📍 Zisťujem polohu...</div>";

    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            vysledky.innerHTML =
                "<div class='kaviaren-box'>✅ Poloha získaná<br>🔍 Hľadám kaviarne...</div>";

            try {

                const query = `
[out:json];
node["amenity"="cafe"](around:1000,${lat},${lon});
out;
`;

                const response = await fetch(
                    "https://overpass-api.de/api/interpreter",
                    {
                        method: "POST",
                        body: query
                    }
                );

                const data = await response.json();

                vysledky.innerHTML = `
                    <div class="kaviaren-box">
                        <h3>✅ Overpass odpovedal</h3>
                        <p>Nájdených záznamov: ${data.elements.length}</p>
                    </div>
                `;

            } catch (error) {

                vysledky.innerHTML = `
                    <div class="kaviaren-box">
                        <h3>❌ Chyba API</h3>
                        <p>${error}</p>
