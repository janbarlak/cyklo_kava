<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyklo Káva</title>

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background: #f4f4f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 5px;
      color: #4a3728;
    }

    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .btn {
      background: #8B5A2B;
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .kaviaren-box {
      background: #fdfaf7;
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      border-left: 5px solid #8B5A2B;
      text-align: left;
    }
  </style>
</head>
<body>

<div class="container">

  <h1>☕ Cyklo Káva</h1>

  <p>Nájdi kaviarne vo svojom okolí</p>

  <button class="btn" onclick="najdiKavu()">
    Vyhľadať v okolí
  </button>

  <div id="vysledky"></div>

</div>

<script>

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

function najdiKavu() {

  const vysledkyDiv = document.getElementById('vysledky');

  vysledkyDiv.innerHTML =
    '<p>Zisťujem vašu polohu...</p>';

  navigator.geolocation.getCurrentPosition(

    function(position) {

      vysledkyDiv.innerHTML = `
        <div class="kaviaren-box">
          <h3>Kaviarne v okolí ☕</h3>
          <p>Poloha úspešne získaná.</p>
          <p>Otváram Google Maps...</p>
        </div>
      `;

      setTimeout(function() {

        window.location.href =
          'https://www.google.com/maps/search/coffee';

      }, 500);

    },

    function(error) {

      vysledkyDiv.innerHTML = `
        <div class="kaviaren-box">
          <h3>GPS chyba ❌</h3>
          <p>${error.message}</p>
        </div>
      `;

    }

  );

}

</script>

</body>
</html>
