<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyklo Káva</title>

<link rel="manifest" href="manifest.json">

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f4f9;
    margin: 0;
    padding: 20px;
    text-align: center;
    color: #333;
}

.container {
    max-width: 500px;
    margin: 0 auto;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

.btn {
    background: #8B5A2B;
    color: white;
    border: none;
    border-radius: 30px;
    padding: 15px;
    width: 100%;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.kaviaren-box {
    background: #fdfaf7;
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    border-left: 5px solid #8B5A2B;
    text-align: left;
}
</style>
</head>

<body>

<div class="container">

    <h1>☕ Cyklo Káva</h1>

    <p>Nájdi top kaviarne vo svojom okolí</p>

    <button class="btn" onclick="najdiKavu()">
        Vyhľadať v okolí
    </button>

    <div id="vysledky"></div>

</div>

<script>

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

async function najdiKavu() {

    const vysledky = document.getElementById("vysledky");

    vysledky.innerHTML = `
        <div class="kaviaren-box">
            📍 Zisťujem polohu...
        </div>
    `;

    navigator.geolocation.getCurrentPosition(

        async function(position) {

            vysledky.innerHTML = `
                <div class="kaviaren-box">
                    ✅ Poloha získaná<br>
                    🌐 Testujem Overpass API...
                </div>
            `;

            try {

                const response = await fetch(
                    "https://overpass-api.de/api/status"
                );

                const text = await response.text();

                vysledky.innerHTML = `
                    <div class="kaviaren-box">
                        ✅ Poloha získaná<br><br>
                        ✅ Overpass API odpovedá
                    </div>
                `;

            } catch(error) {

                vysledky.innerHTML = `
                    <div class="kaviaren-box">
                        ✅ Poloha získaná<br><br>
                        ❌ Overpass API neodpovedá
                    </div>
                `;
            }

        },

        function(error) {

            vysledky.innerHTML = `
                <div class="kaviaren-box">
                    ❌ GPS chyba<br><br>
                    ${error.message}
                </div>
            `;

        }

    );

}

</script>

</body>
</html>
