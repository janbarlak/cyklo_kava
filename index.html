<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyklo Káva</title>

<style>
body {
  font-family: sans-serif;
  padding: 20px;
  text-align: center;
}

button {
  padding: 15px;
  width: 100%;
  background: brown;
  color: white;
  border: 0;
  border-radius: 10px;
}
</style>

</head>
<body>

<h1>☕ Cyklo Káva</h1>

<button onclick="najdiKavu()">
Vyhľadať v okolí
</button>

<div id="vysledky"></div>

<script>

function najdiKavu() {

  document.getElementById("vysledky").innerHTML =
    "<p>Zisťujem polohu...</p>";

  navigator.geolocation.getCurrentPosition(

    function(position){

      document.getElementById("vysledky").innerHTML =
        "<p>✅ Poloha získaná</p>";

    },

    function(error){

      document.getElementById("vysledky").innerHTML =
        "<p>❌ GPS chyba: " + error.message + "</p>";

    }

  );

}

</script>

</body>
</html>
