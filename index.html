<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cyklo Finder</title>

<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cyklo Finder">

<style>
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f4f4f9;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

select{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:12px;
    border:1px solid #ddd;
    font-size:16px;
}

.btn{
    background:#8B5A2B;
    color:white;
    border:none;
    padding:15px;
    width:100%;
    border-radius:30px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.kaviaren-box{
    background:#fdfaf7;
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    border-left:5px solid #8B5A2B;
    text-align:left;
}

.nav-btn{
    background:#8B5A2B;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:20px;
    margin-top:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>🚴 CykloFinder</h1>

<select id="typ">
    <option value="cafe">☕ Kaviareň</option>
    <option value="bakery">🥐 Pekáreň</option>
    <option value="fuel">⛽ Benzínka</option>
    <option value="drinking_water">🚰 Pitná voda</option>
    <option value="supermarket">🛒 Potraviny</option>
    <option value="bicycle">🚴 Cykloservis</option>
</select>

<button class="btn" onclick="hladaj()">
    Vyhľadať v okolí
</button>

<div id="vysledky"></div>

</div>

<script>

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

function vzdialenost(lat1, lon1, lat2, lon2){

    const R = 6371000;

    const dLat = (lat2-lat1) * Math.PI/180;
    const dLon = (lon2-lon1) * Math.PI/180;

    const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2) *
        Math.sin(dLon/2);

    const c = 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );

    return Math.round(R*c);
}

function otvorMapu(lat,lon){

    const url =
        `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;

    window.open(url,"_blank");
}

function sleep(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function hladaj(){

    const vysledky = document.getElementById("vysledky");
    const typ = document.getElementById("typ").value;

let radius = 5000;

if (typ === "fuel") radius = 20000;
if (typ === "drinking_water") radius = 10000;
if (typ === "supermarket") radius = 10000;
if (typ === "bakery") radius = 10000;
if (typ === "bicycle") radius = 20000;

    vysledky.innerHTML =
        "<div class='kaviaren-box'>📍 Zisťujem polohu...</div>";

    navigator.geolocation.getCurrentPosition(

        async function(position){

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            vysledky.innerHTML =
                "<div class='kaviaren-box'>🔍 Hľadám...</div>";

            try{

                let amenity = "cafe";

                if (typ === "fuel") amenity = "fuel";
                if (typ === "drinking_water") amenity = "drinking_water";

                let query = "";

   if (typ === "supermarket") {

    query = `
[out:json];
(
  node["shop"="supers},${lat},${lon};
  way["ound:${radius},${lat},${lon};
);
out center;
`;

} else if (typ === "bakery") {

    query = `
[out:json];
(
  node["shop:${radius},${lat},${lon};
  way["shop"="bakery"](around:${radius},${latenter;
`;

} else if (typ === "bicycle") {

    query = `
[out:json];
(
  node["shop"="bicycle"](lat},${lon};
  way["shop"="bicycle"](around:${radius
out center;
`;

} else {


                    query = `
[out:json];
(
  node["amenity"="${amenity}"](around:${radius},${lat},${lon});
  way["amenity"="${amenity}"](around:${radius},${lat},${lon});
);
out center;
`;

                }

                let response;

                try {

                    response = await fetch(
                        "https://overpass-api.de/api/interpreter",
                        {
                            method:"POST",
                            body:query
                        }
                    );

                } catch(firstError) {

                    vysledky.innerHTML =
                        "<div class='kaviaren-box'>🔄 Opakujem načítanie...</div>";

                    await sleep(2000);

                    response = await fetch(
                        "https://overpass-api.de/api/interpreter",
                        {
                            method:"POST",
                            body:query
                        }
                    );
                }

                if (!response.ok) {
                    throw new Error("Overpass API neodpovedalo");
                }

                const data = await response.json();

                if (!data.elements || data.elements.length === 0){

                    vysledky.innerHTML =
                        "<div class='kaviaren-box'>Nenašli sa žiadne výsledky.</div>";

                    return;
                }

                const body = data.elements
                .map(item => {

                    const itemLat = item.lat || item.center?.lat;
                    const itemLon = item.lon || item.center?.lon;

                    if (!itemLat || !itemLon) {
                        return null;
                    }

                    return {

                name:
    item.tags?.name ||
    (typ === "fuel"
        ? "⛽ Benzínka"
        : typ === "drinking_water"
        ? "🚰 Pitná voda"
        : typ === "supermarket"
        ? "🛒 Potraviny"
        : typ === "bakery"
        ? "🥐 Pekáreň"
        : typ === "bicycle"
        ? "🚴 Cykloservis"
        : "☕ Kaviareň"),

                        lat: itemLat,
                        lon: itemLon,

                        distance: vzdialenost(
                            lat,
                            lon,
                            itemLat,
                            itemLon
                        )

                    };

                })
                .filter(item => item !== null);

                body.sort((a,b) => a.distance - b.distance);

                const top5 = body.slice(0,5);

                vysledky.innerHTML = "";

                top5.forEach(item => {

                    vysledky.innerHTML += `
                    <div class="kaviaren-box">

                        <h3>${item.name}</h3>

                        <p>📍 ${item.distance} m</p>

                        <button
                            class="nav-btn"
                            onclick="otvorMapu(${item.lat},${item.lon})">
                            🚴 Navigovať
                        </button>

                    </div>
                    `;

                });

            }
            catch(error){

                vysledky.innerHTML =
                    "<div class='kaviaren-box'>❌ Nepodarilo sa načítať dáta. Skús znova o chvíľu.</div>";

            }

        },

        function(error){

            vysledky.innerHTML =
                "<div class='kaviaren-box'>❌ " + error.message + "</div>";

        }

    );

}

</script>

</body>
</html>
