<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyklo Káva</title>

<link rel="manifest" href="manifest.json">

<style>
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
background:#f4f4f9;
padding:20px;
text-align:center;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

.btn{
background:#8B5A2B;
color:white;
border:none;
padding:15px;
width:100%;
border-radius:30px;
font-size:16px;
font-weight:bold;
}

.kaviaren-box{
background:#fdfaf7;
margin-top:20px;
padding:15px;
border-radius:12px;
border-left:5px solid #8B5A2B;
}

.link-btn{
display:inline-block;
margin-top:10px;
padding:12px 20px;
background:#8B5A2B;
color:white;
text-decoration:none;
border-radius:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>☕ Cyklo Káva</h1>

<p>Nájdi kaviarne vo svojom okolí</p>

<button class="btn" onclick="najdiKavu()">
Vyhľadať v okolí
</button>

<div id="vysledky"></div>

</div>

<script>

if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('sw.js');
}

function najdiKavu() {

const vysledkyDiv = document.getElementById("vysledky");

vysledkyDiv.innerHTML = "<p>Zisťujem vašu polohu...</p>";

navigator.geolocation.getCurrentPosition(

function(position){

const lat = position.coords.latitude;
const lon = position.coords.longitude;

const mapsUrl =
`https://www.google.com/maps/search/coffee/@${lat},${lon},15z`;

vysledkyDiv.innerHTML = `
<div class="kaviaren-box">
<h3>Kaviarne v okolí ☕</h3>
<p>Poloha úspešne získaná.</p>

<a class="link-btn" hrefe Maps
</a>
</div>
`;

},

function(error){

vysledkyDiv.innerHTML = `
<div class="kaviaren-box">
<h3>GPS chyba</h3>
<p>${error.message}</p>
</div>
`;

}

);

}

</script>

</body>
</html>
