<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyklo Káva</title>

<link rel="manifest" href="manifest.json">

<style>
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f4f4f9;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

.btn{
    background:#8B5A2B;
    color:white;
    border:none;
    padding:15px;
    width:100%;
    border-radius:30px;
    font-size:16px;
    font-weight:bold;
}

.kaviaren-box{
    background:#fdfaf7;
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    border-left:5px solid #8B5A2B;
    text-align:left;
}

.nav-btn{
    background:#8B5A2B;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:20px;
    margin-top:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>☕ Cyklo Káva1</h1>

<p>Nájdi 3 najbližšie kaviarne</p>

<button class="btn" onclick="najdiKavu()">
Vyhľadať v okolí
</button>

<div id="vysledky"></div>

</div>

<script>

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

function vzdialenost(lat1, lon1, lat2, lon2){

    const R = 6371000;

    const dLat = (lat2-lat1) * Math.PI/180;
    const dLon = (lon2-lon1) * Math.PI/180;

    const a =
        Math.sin(dLat/2)*Math.sin(dLat/2) +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2)*Math.sin(dLon/2);

    const c = 2 * Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

    return Math.round(R*c);
}

function otvorMapu(lat,lon){

    const url =
        `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;

    window.open(url,"_blank");
}

async function najdiKavu(){

    const vysledky = document.getElementById("vysledky");

    vysledky.innerHTML =
        "<div class='kaviaren-box'>📍 Zisťujem polohu...</div>";

    navigator.geolocation.getCurrentPosition(

        async function(position){

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            vysledky.innerHTML =
                "<div class='kaviaren-box'>🔍 Hľadám kaviarne...</div>";

            try{

                const query = `
[out:json];
node["amenity"="cafe"](around:1000,${lat},${lon});
out;
`;

                const response = await fetch(
                    "https://overpass-api.de/api/interpreter",
                    {
                        method:"POST",
                        body:query
                    }
                );

                const data = await response.json();

                if(!data.elements || data.elements.length === 0){

                    vysledky.innerHTML =
                        "<div class='kaviaren-box'>Nebola nájdená žiadna kaviareň.</div>";

                    return;
                }

                const cafes = data.elements.map(cafe => ({

                    name: cafe.tags?.name || "Neznáma kaviareň",

                    lat: cafe.lat,

                    lon: cafe.lon,

                    distance: vzdialenost(
                        lat,
                        lon,
                        cafe.lat,
                        cafe.lon
                    )

                }));

                cafes.sort((a,b)=>a.distance-b.distance);

                const top3 = cafes.slice(0,3);

                vysledky.innerHTML = "";

                top3.forEach(cafe => {

                    vysledky.innerHTML += `
                    <div class="kaviaren-box">

                        <h3>☕ ${cafe.name}</h3>

                        <p>📍 ${cafe.distance} m</p>

                        <button
                            class="nav-btn"
                            onclick="otvorMapu(${cafe.lat},${cafe.lon})">
                            🚴 Navigovať
                        </button>

                    </div>
                    `;

                });

            }
            catch(error){

                vysledky.innerHTML =
                    "<div class='kaviaren-box'>❌ Chyba pri načítaní kaviarní.</div>";

            }
        },

        function(error){

            vysledky.innerHTML =
                "<div class='kaviaren-box'>❌ "+error.message+"</div>";

        }

    );
}

</script>

</body>
</html>
